<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170a33">
  <title>Seven Up — NEXO RNG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <!-- Stays at the top while the bet panel and bets list scroll under it (phone). -->
    <div class="sticky">
      <header class="top">
        <button type="button" class="round-btn" id="back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="logo" aria-label="Seven Up">
          <span class="logo__seven">7</span><span class="logo__word">SEVEN<b>UP</b></span>
        </div>
        <div class="wallet">
          <span class="wallet__label" id="mode">Balance</span>
          <strong id="balance">—</strong>
          <button type="button" class="wallet__sound" id="music" aria-label="Music on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.3" r="2.6" fill="currentColor"/></svg>
          </button>
          <button type="button" class="wallet__sound" id="sound" aria-label="Sound on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <section class="stage" aria-label="Dice table">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="stage__edges" aria-hidden="true"></div>
        <!-- placed on the play area by app.js (left/top/width/height) -->
        <div class="play" id="play">
          <div class="dice" id="dice">
            <div class="die-wrap" id="dw0"><div class="die" id="d0"></div><div class="die-shadow"></div></div>
            <div class="die-wrap" id="dw1"><div class="die" id="d1"></div><div class="die-shadow"></div></div>
          </div>
          <div class="reveal" id="reveal" aria-live="polite">
            <div class="reveal__total" id="total"></div>
            <div class="reveal__label" id="totalLabel"></div>
            <div class="reveal__win" id="winLine"></div>
          </div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="conn" id="conn" hidden>Reconnecting…</div>
      </section>

      <div class="history" aria-label="Last totals"><div class="history__track" id="history"></div></div>
    </div>

    <!-- One bet panel -->
    <section class="panel" aria-label="Your bet">
      <div class="panel__inner">
        <div class="zones" role="radiogroup" aria-label="Your call">
          <button type="button" class="zone zone--under" data-pick="under" role="radio" aria-checked="false">
            <span class="zone__name">Under 7</span><span class="zone__range">2 – 6</span><span class="zone__x" data-x="under"></span>
          </button>
          <button type="button" class="zone zone--seven" data-pick="seven" role="radio" aria-checked="false">
            <span class="zone__name">Lucky 7</span><span class="zone__range">exactly 7</span><span class="zone__x" data-x="seven"></span>
          </button>
          <button type="button" class="zone zone--over" data-pick="over" role="radio" aria-checked="false">
            <span class="zone__name">Over 7</span><span class="zone__range">8 – 12</span><span class="zone__x" data-x="over"></span>
          </button>
        </div>
        <div class="sums" id="sums" role="radiogroup" aria-label="Exact total"></div>
        <div class="stake">
          <div class="stepper">
            <button type="button" class="stepper__btn" id="minus" aria-label="Decrease bet">−</button>
            <input class="amount" id="amount" inputmode="decimal" value="1.00" aria-label="Bet amount">
            <button type="button" class="stepper__btn" id="plus" aria-label="Increase bet">+</button>
          </div>
          <div class="quick" id="quick" aria-label="Quick amounts"></div>
        </div>
        <button type="button" class="action" id="roll"><span class="action__label">Roll</span><small class="action__sub" id="rollSub"></small></button>
        <div class="auto">
          <span>Auto roll</span>
          <div class="auto__counts" id="autoCounts" role="radiogroup" aria-label="Auto rolls">
            <button type="button" data-n="0" aria-pressed="true">Off</button>
            <button type="button" data-n="10" aria-pressed="false">10</button>
            <button type="button" data-n="25" aria-pressed="false">25</button>
            <button type="button" data-n="50" aria-pressed="false">50</button>
          </div>
          <label class="auto__stop"><input type="checkbox" id="stopWin"> Stop on win</label>
        </div>
      </div>
    </section>

    <section class="bets">
      <div class="bets__head">
        <div class="bets__tabs" role="tablist">
          <button type="button" role="tab" class="bets__tab bets__tab--on" data-tab="all" aria-selected="true">All bets</button>
          <button type="button" role="tab" class="bets__tab" data-tab="mine" aria-selected="false">My bets</button>
        </div>
        <div class="bets__count"><span id="countLabel">All bets</span> <strong id="betCount">0</strong></div>
      </div>
      <div class="bets__cols" id="cols"><span>Player</span><span>Bet</span><span>Dice</span><span>Win</span></div>
      <div class="bets__list" id="list"></div>
      <button type="button" class="fair" id="fair">Provably fair · round <span id="fRound">—</span></button>
      <div class="fair__detail" id="fairDetail" hidden>
        <p>Server seed hash</p>
        <code id="fHash">—</code>
        <p>Server seed (revealed after the roll)</p>
        <code id="fSeed">—</code>
        <p>Your client seed (mixed into every roll)</p>
        <input class="fair__seed" id="clientSeed" maxlength="64" spellcheck="false" aria-label="Client seed">
        <p class="fair__how">Check: SHA-256(server seed) = hash; die i = (HMAC-SHA256(server seed, client seed:game:round) bytes 4i…4i+3 mod 6) + 1.</p>
      </div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <script src="../_core/sound-unlock.js"></script>
  <script src="../_core/socket-auth.js"></script>
  <script src="../_core/secure-socket.js"></script>
  <script src="/nexorng-config.js"></script>
  <script src="../_core/instant-client.js"></script>
  <script src="app.js"></script>
  <script src="../_core/fit-screen.js"></script>
  <script src="../_core/fair.js"></script>
</body>
</html>

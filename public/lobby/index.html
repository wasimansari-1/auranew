  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Browser bar colour = the header over the page background (no visible edge). -->

  <script>
    (function () {
      // Phones in portrait render the iPhone 17 Pro Max layout (440 CSS px wide) and are
      // zoomed to fit: smaller phones zoom out, bigger phones zoom in. Tablets, desktop
      // and landscape keep their own width. Also used by src/lib/use-viewport-lock.ts.
      var DESIGN_WIDTH = 440;
      var PHONE_MAX_WIDTH = 500;

      function viewportScale() {
        var s = window.screen;
        var shortSide = Math.min(s.width, s.height);
        var portrait = s.orientation && s.orientation.type
          ? s.orientation.type.indexOf('portrait') === 0
          : s.height >= s.width;
        if (!portrait || !shortSide || shortSide > PHONE_MAX_WIDTH) return 0;
        return Math.round((shortSide / DESIGN_WIDTH) * 10000) / 10000;
      }

      window.__nxViewport = function () {
        var scale = viewportScale();
        var content = scale
          ? 'width=' + DESIGN_WIDTH + ', initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=' + scale
          : 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1';
        return { content: content + ', user-scalable=no, viewport-fit=cover', scale: scale || 1 };
      };

      function lockViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute('content', window.__nxViewport().content);
        }
      }

      function blockGesture(event) {
        event.preventDefault();
      }

      function blockPinch(event) {
        if (event.touches && event.touches.length > 1) {
          event.preventDefault();
        }
      }

      lockViewport();
      window.addEventListener('orientationchange', lockViewport);
      document.addEventListener('gesturestart', blockGesture, { passive: false });
      document.addEventListener('gesturechange', blockGesture, { passive: false });
      document.addEventListener('gestureend', blockGesture, { passive: false });
      document.addEventListener('touchstart', blockPinch, { passive: false, capture: true });
      document.addEventListener('touchmove', blockPinch, { passive: false, capture: true });
    })();
  </script>
  <style>
    #nx-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 18px;
      background: radial-gradient(ellipse 60% 45% at 50% 42%, rgba(139, 0, 224, 0.22), transparent 70%), #070311;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      animation: nx-boot-safety 0s linear 12s forwards;
    }
    #nx-boot.boot-done { opacity: 0; visibility: hidden; pointer-events: none; }
    #nx-boot .boot-msg { margin: 0; min-height: 1.4em; color: #c9b8ee; font: 600 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: 0.2px; transition: opacity 0.25s; }
    @keyframes nx-boot-safety { to { opacity: 0; visibility: hidden; pointer-events: none; } }
    #nx-boot .boot-stage { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
    #nx-boot .boot-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 207, 107, 0.12);
      border-top-color: #ffcf6b;
      border-right-color: rgba(255, 207, 107, 0.45);
      animation: nx-boot-spin 1.1s linear infinite;
    }
    #nx-boot .boot-logo { width: 120px; height: auto; animation: nx-boot-pulse 1.8s ease-in-out infinite alternate; }
    @keyframes nx-boot-spin { to { transform: rotate(360deg); } }
    @keyframes nx-boot-pulse { from { transform: scale(0.97); } to { transform: scale(1.03); } }
    @media (prefers-reduced-motion: reduce) {
      #nx-boot .boot-ring, #nx-boot .boot-logo { animation: none; }
      #nx-boot { transition: none; }
    }
  </style>

<body>
  <!-- Startup loader: shown before the app loads; faded out by src/main.tsx once the app paints. -->
  <div id="nx-boot" role="status" aria-label="Loading NEXORNG">
    <div class="boot-stage">
      <div class="boot-ring"></div>
      <img class="boot-logo" src="/logo2.webp" alt="NEXORNG">
    </div>
    <p class="boot-msg" id="nx-boot-msg"></p>
  </div>
  <script>
    // Gambling-style lines in a random order each visit (same list as src/lib/loader-messages.ts).
    (function () {
      var m = ['Shuffling the deck…', 'Stacking your chips…', 'Warming up the reels…', 'Spinning up the wheel…', 'Rolling the dice…',
        'Dealing the cards…', 'Polishing the lucky lamp…', 'Waking the genie…', 'Fuelling the rocket…', 'Laying out the felt…',
        'Calling the croupier…', 'Lighting up the casino floor…', 'Charging the multipliers…', 'Seeding a provably fair round…',
        'Finding your lucky seat…', 'Counting the chips twice…', 'Lining up the sevens…', 'Setting the table…', 'Checking the odds…',
        'Cueing the high rollers…'];
      for (var i = m.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = m[i]; m[i] = m[j]; m[j] = t; }
      var el = document.getElementById('nx-boot-msg'), boot = document.getElementById('nx-boot'), k = 0;
      el.textContent = m[0];
      var timer = setInterval(function () {
        if (boot.classList.contains('boot-done')) return clearInterval(timer);
        k = (k + 1) % m.length;
        el.textContent = m[k];
      }, 1400);
    })();
  </script>
  <div id="root"></div>
</body>

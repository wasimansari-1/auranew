<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a2410">
  <title>Gold Digger — NEXO RNG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-event="88.0010" data-key="golddigger" data-bet="DRILL" data-cashout="CASH OUT" data-won="STRUCK GOLD">
  <main class="game">
    <!-- Stays at the top while the bet panel and the bets list scroll under it (phone). -->
    <div class="sticky">
      <header class="top">
        <button type="button" class="round-btn" id="back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <img class="logo" src="assets/logo.webp" srcset="assets/logo.webp 1x, assets/logo@2x.webp 2x" height="40" alt="Gold Digger">
        <div class="wallet">
          <span class="wallet__label" id="mode">Balance</span>
          <strong id="balance">—</strong>
          <button type="button" class="wallet__sound" id="music" aria-label="Music on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.3" r="2.6" fill="currentColor"/></svg>
          </button>
          <button type="button" class="wallet__sound" id="sound" aria-label="Sound on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <section class="stage" aria-label="Gold Digger">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="stage__edges" aria-hidden="true"></div>
        <div class="stage__center">
          <div class="flew" id="flew" hidden></div>
          <div class="mult" id="mult"></div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="conn" id="conn" hidden>Reconnecting…</div>
      </section>

      <div class="history" aria-label="My last results"><div class="history__track" id="history"></div></div>
    </div>

    <!-- The mine's control console: stake gauge, ore-nugget quick amounts, the DRILL button
         (it turns into the gold sack to cash out) and the auto-stop depth lever. -->
    <div class="panels">
      <section class="panel rig" aria-label="Your bet">
        <div class="panel__inner rig__plate">
          <span class="rivet" aria-hidden="true"></span><span class="rivet" aria-hidden="true"></span><span class="rivet" aria-hidden="true"></span><span class="rivet" aria-hidden="true"></span>
          <div class="stake">
            <button type="button" class="knob" id="minus" aria-label="Decrease bet">−</button>
            <div class="gauge">
              <div class="gauge__face" aria-hidden="true"><span class="gauge__needle"></span><span class="gauge__hub"></span><span class="gauge__word">STAKE</span></div>
              <label class="gauge__lcd"><span class="sr">Bet amount</span><input class="amount" id="amount" inputmode="decimal" value="1.00"></label>
            </div>
            <button type="button" class="knob" id="plus" aria-label="Increase bet">+</button>
          </div>
          <div class="quick nuggets" id="quick" aria-label="Quick amounts"></div>
          <div class="drill-bay">
            <button type="button" class="action" id="action"><span id="actionLabel">DRILL</span><small id="actionSub"></small></button>
          </div>
          <div class="auto depth">
            <span class="depth__word">AUTO STOP</span>
            <label class="switch lever"><input type="checkbox" id="autoOn" aria-label="Auto cash out"><span class="switch__track"><span class="switch__knob"></span></span></label>
            <label class="depth__read"><span class="sr">Auto cash-out multiplier</span><input class="auto__x" id="autoAt" inputmode="decimal" value="2.00"><span aria-hidden="true">x</span></label>
          </div>
        </div>
      </section>
    </div>

    <section class="bets">
      <div class="bets__head">
        <div class="bets__tabs" role="tablist">
          <button type="button" role="tab" class="bets__tab bets__tab--on" data-tab="all" aria-selected="true">All bets</button>
          <button type="button" role="tab" class="bets__tab" data-tab="mine" aria-selected="false">My bets</button>
        </div>
        <div class="bets__count"><span id="countLabel">All bets</span> <strong id="betCount">0</strong></div>
      </div>
      <div class="bets__cols" id="cols"><span>Player</span><span>Bet</span><span>X</span><span>Win</span></div>
      <div class="bets__list" id="list"></div>
      <p class="fair" id="fair">Provably fair · your own round every time</p>
      <div class="fair__detail" id="fairDetail" hidden>
        <p>Result hash (given when your round starts)</p>
        <code id="fHash">—</code>
        <p>Seed (revealed when your round ends)</p>
        <code id="fSeed">—</code>
        <p>Check: SHA-256(seed) = hash.</p>
      </div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <script src="../_core/sound-unlock.js"></script>
  <script src="../_core/socket-auth.js"></script>
  <script src="../_core/secure-socket.js"></script>
  <script src="/nexorng-config.js"></script>
  <script src="../_core/phrases.js"></script>
  <script src="../_core/solo-client.js"></script>
  <script src="miner.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
  <script src="../_core/fit-screen.js"></script>
  <script src="../_core/fair.js"></script>
</body>
</html>

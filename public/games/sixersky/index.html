<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a3170">
  <title>Sixer Sky — NEXO RNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <!-- Stays at the top while the bet panel and the bets list scroll under it (phone). -->
    <div class="sticky">
      <header class="top">
        <button type="button" class="round-btn" id="back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <!-- Our own wordmark: SIXER SKY with the ball's flight arc. -->
        <svg class="logo" viewBox="0 0 236 56" role="img" aria-label="Sixer Sky">
          <defs>
            <linearGradient id="lg-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4cf"/><stop offset=".55" stop-color="#f1c45c"/><stop offset="1" stop-color="#b9842a"/></linearGradient>
            <radialGradient id="lg-ball" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#fff"/><stop offset=".7" stop-color="#e9e6ee"/><stop offset="1" stop-color="#a9a3b6"/></radialGradient>
          </defs>
          <path d="M10 50 Q 118 -14 214 18" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
          <text x="4" y="45" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-weight="900" font-style="italic" font-size="40" letter-spacing="1" fill="#fff" stroke="#120a20" stroke-width="1.2" paint-order="stroke">SIXER <tspan fill="url(#lg-gold)">SKY</tspan></text>
          <circle cx="219" cy="17" r="10" fill="url(#lg-ball)"/>
          <path d="M212.5 10.5 Q 219 17 212.5 23.5 M225.5 10.5 Q 219 17 225.5 23.5" stroke="#b0242f" stroke-width="1.3" fill="none" stroke-dasharray="1.6 1.4"/>
        </svg>
        <div class="wallet">
          <span class="wallet__label" id="mode">Balance</span>
          <strong id="balance">—</strong>
          <button type="button" class="wallet__sound" id="music" aria-label="Music on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.3" r="2.6" fill="currentColor"/></svg>
          </button>
          <button type="button" class="wallet__sound" id="sound" aria-label="Sound on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <section class="stage" aria-label="The ball's flight">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="stage__edges" aria-hidden="true"></div>
        <div class="stage__center">
          <div class="mult" id="mult"></div>
          <div class="flew" id="flew" hidden></div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="conn" id="conn" hidden>Reconnecting…</div>
      </section>

      <div class="history" aria-label="Last results"><div class="history__track" id="history"></div></div>
    </div>

    <!-- Two scoreboard bet panels (two bets per round); phones show one. Built by app.js. -->
    <div class="panels" id="panels"></div>

    <section class="bets">
      <div class="bets__head">
        <div class="bets__tabs" role="tablist">
          <button type="button" role="tab" class="bets__tab bets__tab--on" data-tab="all" aria-selected="true">All bets</button>
          <button type="button" role="tab" class="bets__tab" data-tab="mine" aria-selected="false">My bets</button>
        </div>
        <div class="bets__count"><span id="countLabel">All bets</span> <strong id="betCount">0</strong></div>
      </div>
      <div class="bets__cols" id="cols"><span>Player</span><span>Bet</span><span>X</span><span>Win</span></div>
      <div class="bets__list" id="list"></div>
      <p class="fair" id="fair">Provably fair · round <span id="fRound">—</span></p>
      <div class="fair__detail" id="fairDetail" hidden>
        <p>Result hash (published before the round)</p>
        <code id="fHash">—</code>
        <p>Seed (revealed after the round)</p>
        <code id="fSeed">—</code>
        <p>Check: SHA-256(seed) = hash.</p>
      </div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <script src="../_core/sound-unlock.js"></script>
  <script src="../_core/socket-auth.js"></script>
  <script src="../_core/secure-socket.js"></script>
  <script src="/nexorng-config.js"></script>
  <script src="../_core/phrases.js"></script>
  <script src="../_core/crash-client.js"></script>
  <script src="../_core/players.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
  <script src="../_core/fit-screen.js"></script>
  <script src="../_core/fair.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a6e8c">
  <title>Dragon Ascent — NEXO RNG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <!-- Stays at the top while the bet panel and bets list scroll under it. -->
    <div class="sticky">
      <header class="top">
        <button type="button" class="round-btn" id="back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="logo" role="img" aria-label="Dragon Ascent">
          <svg class="logo__mark" viewBox="0 0 40 40" aria-hidden="true">
            <defs>
              <linearGradient id="lgRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a1"/><stop offset="1" stop-color="#d1902a"/></linearGradient>
              <linearGradient id="lgBody" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff0c8"/><stop offset="1" stop-color="#1c9c86"/></linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18.5" fill="#0f3036" stroke="url(#lgRim)" stroke-width="2.4"/>
            <path d="M9 30c4-1 6-4 6-8s3-8 8-8c4 0 6 2 7 4" fill="none" stroke="url(#lgBody)" stroke-width="4.6" stroke-linecap="round"/>
            <path d="M27 11.5c2.2-.4 4.4.6 5.4 2.6l-2.6 2.2c-.6 1.4-2.2 2-3.6 1.6-1.6-.5-2.4-2.2-1.8-3.8.4-1.3 1.3-2.4 2.6-2.6z" fill="#7ff0c8"/>
            <path d="M27.5 11.6 26 7.6M29.6 12l1.4-4" stroke="url(#lgRim)" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="28.4" cy="14.2" r="1" fill="#0f3036"/>
            <path d="M13 24l-2.6-1.8M15.4 18.6l-2.8-.6M19.2 14.6 17.6 12" stroke="#ff8a63" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="logo__text"><b>DRAGON</b><i>ASCENT</i></span>
        </div>
        <div class="wallet">
          <span class="wallet__label" id="mode">Balance</span>
          <strong id="balance">—</strong>
          <button type="button" class="wallet__sound" id="music" aria-label="Music on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6.2l10-2.2v11.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.3" r="2.6" fill="currentColor"/></svg>
          </button>
          <button type="button" class="wallet__sound" id="sound" aria-label="Sound on" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z" fill="currentColor"/></svg>
          </button>
        </div>
      </header>

      <section class="stage" aria-label="Dragon flight">
        <canvas id="scene" aria-hidden="true"></canvas>
        <div class="stage__edges" aria-hidden="true"></div>
        <div class="stage__center">
          <div class="flew" id="flew" hidden></div>
          <div class="mult" id="mult"></div>
          <div class="hint" id="hint"></div>
        </div>
        <div class="conn" id="conn" hidden>Reconnecting…</div>
      </section>

      <div class="history" aria-label="Last results"><div class="history__track" id="history"></div></div>
    </div>

    <!-- Bet talismans: phone shows one, wide screens two side by side. -->
    <div class="panels" id="panels"></div>

    <section class="bets">
      <div class="bets__head">
        <div class="bets__tabs" role="tablist">
          <button type="button" role="tab" class="bets__tab bets__tab--on" data-tab="all" aria-selected="true">All bets</button>
          <button type="button" role="tab" class="bets__tab" data-tab="mine" aria-selected="false">My bets</button>
        </div>
        <div class="bets__count"><span id="countLabel">All bets</span> <strong id="betCount">0</strong></div>
      </div>
      <div class="bets__cols" id="cols"><span>User</span><span>Bet</span><span>X</span><span>Cash out</span></div>
      <div class="bets__list" id="list"></div>
      <p class="fair" id="fair">Provably fair · round <span id="fRound">—</span></p>
      <div class="fair__detail" id="fairDetail" hidden>
        <p>Result hash (published before the round)</p>
        <code id="fHash">—</code>
        <p>Seed (revealed after the round)</p>
        <code id="fSeed">—</code>
        <p>Check: SHA-256(seed) = hash.</p>
      </div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
  </main>
  <script src="../_core/sound-unlock.js"></script>
  <script src="../_core/socket-auth.js"></script>
  <script src="../_core/secure-socket.js"></script>
  <script src="/nexorng-config.js"></script>
  <script src="../_core/phrases.js"></script>
  <script src="../_core/crash-client.js"></script>
  <script src="../_core/players.js"></script>
  <script src="app.js"></script>
  <script src="../_core/fit-screen.js"></script>
  <script src="../_core/fair.js"></script>
</body>
</html>
